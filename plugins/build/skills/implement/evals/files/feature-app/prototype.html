<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selected project reference</title>
<style>
body{font:16px system-ui;margin:32px;background:#f6f7fa;color:#182230}header{margin-bottom:24px}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:24px}.panel{background:white;padding:24px;border:1px solid #d8dee9;border-radius:12px}
.filter{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}button,select{font:inherit;padding:10px;border-radius:6px}
button{display:block;margin:12px 0;border:1px solid #d8dee9;background:white;width:100%;text-align:left}.picked{border:2px solid #d56812}
@media(max-width:700px){.layout{grid-template-columns:1fr}body{margin:16px}}
</style>
<header><h1>Projects</h1><p>Browse projects and keep one selected while filtering.</p></header>
<main class="layout"><section class="panel"><div class="filter"><label>Status <select><option>All</option><option>Active</option><option>Archived</option><option>Paused</option></select></label><span>3 projects</span></div>
<button class="picked">Tide — Active</button><button>Forest — Archived</button><button>North — Active</button></section>
<aside class="panel"><h2>Selected project</h2><p>Tide</p></aside></main>
</html>
