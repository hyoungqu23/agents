[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hm2-review-harness"
version = "0.1.0"
description = "Local draft-only automation for the four HM2 review workflows"
requires-python = ">=3.12"

[project.scripts]
hm2-review-harness = "hm2_review_harness.cli:main"
