<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>읽기의 서가 · 선택된 디자인</title><style>
:root{--bg:#f3f1ea;--surface:#fffef9;--ink:#213d35;--muted:#52665e;--accent:#28634e;--soft:#e4eee6;--line:#c3cdc3;--danger:#9b3027;--danger-bg:#fff0eb;--radius:18px;--space:24px;--font:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;--small:14px;--body:16px;--title:clamp(28px,4vw,44px);--focus:3px solid #ac4e12;--shadow:0 10px 36px #213d350d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:var(--body)/1.65 var(--font)}button,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button,select{min-height:44px}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px 16px;text-align:left}button:hover{background:var(--soft)}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:var(--focus);outline-offset:3px}button[aria-pressed=true],.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}h1{font-size:var(--title);line-height:1.25;letter-spacing:-.04em;margin:12px 0}h2{font-size:24px;line-height:1.4;margin:0 0 12px}h3,p{margin:0 0 14px}a{color:var(--accent)}.shell{max-width:1180px;margin:auto;padding:36px var(--space) 52px}.brand{font-weight:800;letter-spacing:.1em;font-size:var(--small)}.eyebrow{font-size:var(--small);color:var(--muted)}.masthead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:32px}.badge{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px}.intro{margin-bottom:28px;max-width:740px}.muted{color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space);box-shadow:var(--shadow);min-width:0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.tagbar{margin-bottom:20px}.note-list{display:grid;gap:10px}.note{display:block;width:100%;padding:18px}.note strong,.note span{display:block}.note span{font-size:var(--small);margin-top:5px}.note:hover strong{text-decoration:underline}.status{padding:28px 0}.error{color:var(--danger);background:var(--danger-bg);padding:24px;border-radius:var(--radius);border:1px solid var(--danger)}.reader{white-space:pre-wrap;font-size:18px;line-height:1.95;overflow-wrap:anywhere}.reading-head{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}.back{margin-bottom:22px}.demo{margin-top:32px;border-top:1px dashed var(--line);padding-top:18px;color:var(--muted);font-size:var(--small)}summary{cursor:pointer;min-height:44px}.demo-row{display:flex;gap:18px;flex-wrap:wrap;align-items:end;padding:16px 0}.demo label{display:grid;gap:6px}select{padding:8px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:100%}.stepper{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;font-size:var(--small)}.stepper span{padding:6px 12px;border-radius:99px;background:var(--soft)}.stepper [aria-current=step]{background:var(--accent);color:var(--surface)}.stage{max-width:760px;margin:auto}.footer-note{font-size:var(--small);margin-top:24px;color:var(--muted)}@media(max-width:600px){.shell{padding:22px 16px 36px}.panel{padding:20px}.masthead{align-items:flex-start;margin-bottom:24px}.badge{max-width:150px}.demo-row{display:grid}.reader{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><div class="shell"><header class="masthead"><div class="brand">읽기의 서가 / NOTES</div><span class="badge">보존된 디자인 · B</span></header><div class="intro"><div class="eyebrow">PERSONAL READING ARCHIVE</div><h1>다시 만나고 싶은 생각.</h1><p class="muted">기존 태그로 노트를 찾고, 저장한 내용을 읽어 보세요.</p></div><main id="app"></main><p class="footer-note">합성 샘플 4개 · 기존 태그 4개 · 모든 동작은 이 페이지 안에서만 시연됩니다.</p></div><script>
const tags=['사유','디자인','기록','보관'];
// 명시적인 합성 샘플: 실제 사용자의 노트나 읽기 결과가 아닙니다.
const notes=[
{id:'n1',title:'생각을 남기는 이유',tags:['사유','기록'],body:'생각을 남기는 이유\n\n읽으며 떠오른 생각은 시간이 지나면 모양이 달라진다. 짧게라도 남겨 두면, 나중의 내가 어디에서 출발했는지 알 수 있다.\n\n기록은 결론을 보관하는 일뿐 아니라 질문을 다시 만나는 일이기도 하다.'},
{id:'n2',title:'좋은 질문의 여백',tags:['사유'],body:'좋은 질문의 여백\n\n빠른 답보다 오래 남는 질문이 있다. 이해했다고 느끼는 순간에도 무엇을 놓쳤는지 한 번 더 묻는다.\n\n다음에 읽을 때는 답을 먼저 찾기보다 질문이 생긴 문장을 다시 살펴보자.'},
{id:'n3',title:'작은 선택을 돕는 화면',tags:['디자인'],body:'작은 선택을 돕는 화면\n\n한 화면에서 지금 할 수 있는 일을 분명하게 보여 준다. 선택의 결과를 가까이 두면 다음 행동을 판단하기 쉽다.'},
{id:'n4',title:'읽기와 다시 읽기 사이의 긴 간격에도 발견할 수 있는 기록',tags:['디자인','기록'],body:'읽기와 다시 읽기 사이의 기록\n\n노트의 제목은 나중에 찾는 나를 위한 단서다. 원래의 문맥을 되찾을 수 있도록 읽을 때의 질문을 함께 적는다.\n\n비슷해 보이는 단어를 임의로 같은 태그로 다루지 않는다.'}
];
let selected=null, opened=null, lookupFailure=false, readFailure=false;
const app=document.getElementById('app');
function results(){return notes.filter(n=>n.tags.includes(selected))}
function tagButtons(){return '<div class="tags" aria-label="기존 태그">'+tags.map(t=>`<button data-tag="${t}" aria-pressed="${selected===t}"># ${t}</button>`).join('')+'</div>'}
function resultView(){
 if(!selected)return '<div class="status"><h2>어떤 생각을 찾고 있나요?</h2><p class="muted">기존 태그를 선택하면 해당 태그의 노트를 보여 드립니다.</p></div>';
 if(lookupFailure)return `<div class="error" role="alert"><h2>태그 조회 실패</h2><p># ${selected} 노트를 불러오지 못했습니다.</p><p>결과가 있는지는 아직 알 수 없습니다. 다른 태그를 선택할 수 있습니다.</p></div>`;
 const list=results();
 if(!list.length)return `<div class="status"><div class="eyebrow">조회 완료 · 0개</div><h2># ${selected} 노트가 없습니다</h2><p class="muted">이 태그가 달린 노트가 없습니다. 다른 기존 태그를 선택해 보세요.</p></div>`;
 return `<div class="eyebrow">조회 완료 · ${list.length}개</div><h2># ${selected} 노트</h2><div class="note-list">`+list.map(n=>`<button class="note" data-note="${n.id}"><strong>${n.title}</strong><span>${n.tags.map(t=>'# '+t).join(' · ')}　↗ 읽기</span></button>`).join('')+'</div>';
}
function readerView(){
 if(!opened)return '<div class="status"><div class="eyebrow">READING ROOM</div><h2>노트를 펼쳐 보세요</h2><p class="muted">결과에서 노트를 선택하면 저장된 내용이 여기에 열립니다.</p></div>';
 const n=notes.find(n=>n.id===opened);
 if(readFailure)return `<div class="error" role="alert"><h2>노트 내용 열기 실패</h2><p>“${n.title}”의 내용을 열지 못했습니다.</p><p>태그 조회는 완료되었습니다. 결과로 돌아가 다른 노트를 선택할 수 있습니다.</p></div>`;
 return `<div class="reading-head"><div class="eyebrow">저장된 내용 · 합성 샘플</div><h2>${n.title}</h2><span class="muted">${n.tags.map(t=>'# '+t).join(' · ')}</span></div><div class="reader">${n.body}</div>`;
}
function demoView(){return `<details class="demo"><summary>시연 설정 · 샘플 데이터 / 실패 상태</summary><p>아래 제어는 평가용입니다. 실제 조회·내용 읽기와 재시도 정책을 구현하지 않습니다. ‘보관’ 태그는 성공한 빈 결과를 보여 줍니다.</p><div class="demo-row"><label>태그 조회<select id="lookup"><option value="ok" ${!lookupFailure?'selected':''}>성공</option><option value="fail" ${lookupFailure?'selected':''}>실패 시연</option></select></label><label>노트 내용 읽기<select id="read"><option value="ok" ${!readFailure?'selected':''}>성공</option><option value="fail" ${readFailure?'selected':''}>실패 시연</option></select></label><button id="reset">시연 초기화</button></div></details>`}
function layoutB(){return `<div class="stage"><nav class="stepper" aria-label="탐색 단계"><span ${!selected?'aria-current="step"':''}>1 태그 선택</span><span ${selected&&!opened?'aria-current="step"':''}>2 결과 확인</span><span ${opened?'aria-current="step"':''}>3 노트 읽기</span></nav><section class="panel">${opened?'<button class="back" id="back">← # '+selected+' 결과로</button>'+readerView():selected?'<button class="back" id="tagsBack">← 태그 다시 선택</button>'+resultView():'<div class="eyebrow">나의 읽기 노트</div><h2>태그 하나에서 시작하세요</h2><p class="muted">기억해 둔 태그로, 다시 읽고 싶은 노트까지.</p>'+tagButtons()}</section>${demoView()}</div>`}
function render(){app.innerHTML=layout();bind()}
function focusHeading(){const el=app.querySelector('h2');if(el){el.tabIndex=-1;el.focus()}}
function bind(){
 app.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{selected=b.dataset.tag;opened=null;render();focusHeading()});
 app.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{opened=b.dataset.note;render();focusHeading()});
 const back=app.querySelector('#back');if(back)back.onclick=()=>{const old=opened;opened=null;render();const target=app.querySelector(`[data-note="${old}"]`);if(target)target.focus()};
 const tb=app.querySelector('#tagsBack');if(tb)tb.onclick=()=>{const old=selected;selected=null;opened=null;render();app.querySelector(`[data-tag="${old}"]`).focus()};
 app.querySelector('#lookup').onchange=e=>{lookupFailure=e.target.value==='fail';opened=null;render();app.querySelector('.demo').open=true;app.querySelector('#lookup').focus()};
 app.querySelector('#read').onchange=e=>{readFailure=e.target.value==='fail';render();app.querySelector('.demo').open=true;app.querySelector('#read').focus()};
 app.querySelector('#reset').onclick=()=>{selected=null;opened=null;lookupFailure=false;readFailure=false;render();focusHeading()};
}
function layout(){return layoutB()}
render();</script></body></html>
