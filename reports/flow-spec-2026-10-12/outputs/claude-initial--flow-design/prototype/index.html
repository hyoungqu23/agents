<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>태그로 노트 찾기 — 디자인 참조 (변형 B)</title>
<!-- Design reference promoted from explore/index.html variant B (user-selected). Direct-file compatible; no external assets.
     Not production code. Sample data simulated locally. -->
<style>
:root{
 --color-bg:#f6f4ef;--color-surface:#fff;--color-ink:#1f2328;--color-muted:#5b6470;--color-line:#d5d0c4;
 --color-accent:#1f5f8b;--color-selected:#e3eef6;
 --color-empty-bg:#f1efe8;--color-empty-line:#8a8577;
 --color-fail-bg:#fdecea;--color-fail-line:#b3261e;--color-fail-ink:#7a1510;
 --radius:8px;--gap:16px;--tap-min:44px;--font:system-ui,-apple-system,"Segoe UI",sans-serif;
 --measure:720px
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-ink);font:16px/1.5 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}
h1,h2,h3{margin:0}
.tagbtn,.notebtn,.ghost{border:1px solid var(--color-line);background:var(--color-surface);border-radius:var(--radius);padding:8px 12px;min-height:var(--tap-min);text-align:left}
.tagbtn[aria-pressed=true]{background:var(--color-selected);border-color:var(--color-accent);box-shadow:inset 3px 0 0 var(--color-accent)}
.state{border-radius:var(--radius);padding:var(--gap)}
.state h3{font-size:17px}
.state p{margin:4px 0 0}
.state.empty{background:var(--color-empty-bg);border:2px dashed var(--color-empty-line)}
.state.fail{background:var(--color-fail-bg);border:2px solid var(--color-fail-line);color:var(--color-fail-ink)}
.state.hint{border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-muted)}
.note-body{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius);padding:var(--gap);white-space:pre-wrap}
.meta{color:var(--color-muted);font-size:14px}
.cnt{font-size:14px;color:var(--color-muted)}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ghost{text-align:center}
.b-wrap{max-width:var(--measure);margin:0 auto;padding:var(--gap)}
.b-wrap header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.b-tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px}
.b-tags .tagbtn{flex:1 1 140px}
.b-card{display:block;width:100%}
.b-reader{display:grid;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
// Sample data only (labeled). Simulated locally; no network, no mutation.
var NOTES=[
{id:'n1',title:'소크라테스의 변론 메모',tags:['철학'],text:'(샘플 내용) 무지의 자각과 대화법에 대한 독서 메모.'},
{id:'n2',title:'니코마코스 윤리학 1권',tags:['철학'],text:'(샘플 내용) 행복을 활동으로 보는 관점을 정리한 메모.'},
{id:'n3',title:'로마 공화정의 몰락',tags:['역사'],text:'(샘플 내용) 그라쿠스 형제 개혁과 내전의 연결을 정리한 메모.'},
{id:'n4',title:'스토아 철학과 로마',tags:['철학','역사'],text:'(샘플 내용) 철학과 역사 두 태그가 함께 달린 노트.'},
{id:'n5',title:'과학혁명의 구조',tags:['과학'],text:'(샘플 내용) 패러다임 전환에 대한 메모.'},
{id:'n6',title:'우주의 크기 (읽기 실패 시연)',tags:['과학'],readFails:true,text:''}
];
var TAGS=[
{name:'철학',note:''},{name:'역사',note:''},{name:'과학',note:''},
{name:'보관함',note:'시연: 노트 없음'},{name:'조회오류',note:'시연: 조회 실패'}
];
var FAIL_TAGS={'조회오류':1};
var S={tag:null,noteId:null};
function lookup(t){if(FAIL_TAGS[t])return{ok:false};return{ok:true,notes:NOTES.filter(function(n){return n.tags.indexOf(t)>-1})}}
function readNote(id){var n=NOTES.filter(function(x){return x.id===id})[0];return{ok:!!n&&!n.readFails,note:n}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'})}
function tagBtns(){return TAGS.map(function(t){return '<button class="tagbtn" data-act="tag" data-v="'+esc(t.name)+'" data-k="b-t-'+esc(t.name)+'" aria-pressed="'+(S.tag===t.name)+'"><strong>#'+esc(t.name)+'</strong>'+(t.note?'<br><span class="meta">'+esc(t.note)+'</span>':'')+'</button>'}).join('')}
function lookupState(r,tag){
 if(!r.ok)return '<div class="state fail" role="alert"><h3>⚠ 조회 실패</h3><p>#'+esc(tag)+' 태그를 조회하지 못했습니다. 노트가 없다는 뜻이 아닙니다.</p></div>';
 if(!r.notes.length)return '<div class="state empty" role="status"><h3>∅ 결과 없음</h3><p>조회는 성공했고 #'+esc(tag)+' 태그가 달린 노트가 없습니다.</p></div>';
 return '';
}
function noteState(r){
 if(!r.ok)return '<div class="state fail" role="alert"><h3>⚠ 노트 내용 열기 실패</h3><p>「'+esc(r.note?r.note.title:'')+'」의 저장된 내용을 읽지 못했습니다. 태그 조회 결과와는 별개의 실패입니다.</p></div>';
 return '<h3>'+esc(r.note.title)+'</h3><p class="meta">태그: '+r.note.tags.map(function(t){return '#'+esc(t)}).join(' ')+'</p><div class="note-body">'+esc(r.note.text)+'</div>';
}
function view(){
 var h='<div class="b-wrap"><header><h1>태그로 노트 찾기</h1><button class="ghost" data-act="reset" data-k="b-reset">처음으로</button></header>'
 +'<p class="meta">샘플 노트로 만든 시연입니다. 실제 데이터를 읽지 않습니다.</p>'
 +'<h2 class="cnt" id="b-tag-h">1. 기존 태그 선택</h2><div class="b-tags" role="group" aria-labelledby="b-tag-h">'+tagBtns()+'</div>';
 if(S.noteId){
  h+='<section class="b-reader" aria-label="노트 내용"><button class="ghost" data-act="close" data-k="b-back" data-focus>← #'+esc(S.tag)+' 결과로</button>'+noteState(readNote(S.noteId))+'</section>';
 }else if(!S.tag){
  h+='<div class="state hint">태그를 선택하면 해당 태그가 달린 노트가 여기에 표시됩니다.</div>';
 }else{
  var r=lookup(S.tag),st=lookupState(r,S.tag);
  h+='<section aria-label="조회 결과" aria-live="polite"><h2 class="cnt">2. #'+esc(S.tag)+' 결과'+(r.ok?' · '+r.notes.length+'개':'')+'</h2>';
  h+=st||('<ul class="plain">'+r.notes.map(function(n){return '<li><button class="notebtn b-card" data-act="open" data-v="'+n.id+'" data-k="b-n-'+n.id+'"><strong>'+esc(n.title)+'</strong><br><span class="meta">'+n.tags.map(function(t){return '#'+esc(t)}).join(' ')+'</span></button></li>'}).join('')+'</ul>');
  h+='</section>';
 }
 return h+'</div>';
}
var root=document.getElementById('app');
function draw(){
 var a=document.activeElement,k=a&&a.getAttribute&&a.getAttribute('data-k');
 root.innerHTML=view();
 if(k){var e=root.querySelector('[data-k="'+k+'"]');if(e)e.focus()}
}
root.addEventListener('click',function(ev){
 var b=ev.target.closest('[data-act]');if(!b)return;
 var act=b.getAttribute('data-act'),v=b.getAttribute('data-v');
 if(act==='tag'){S.tag=v;S.noteId=null}
 else if(act==='open'){S.noteId=v}
 else if(act==='close'){S.noteId=null}
 else if(act==='reset'){S.tag=null;S.noteId=null}
 draw();
 if(act==='open'){var f=root.querySelector('[data-focus]');if(f)f.focus()}
});
draw();
})();
</script>
</body>
</html>
